# secret_key_base signs and encrypts cookies and Devise tokens.
# Development and production read it from the environment (.env locally, see .env.example).
# The test value is not secret; it only lets the suite (and CI) run without a .env.

development:
  secret_key_base: <%= ENV["SECRET_KEY_BASE"] %>

